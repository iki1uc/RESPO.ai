<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RESPO.ai · NC‑Router</title>

<script type="module">

/* -----------------------------
   1. AXIOM + VEC empfangen
------------------------------ */
const AXIOM = JSON.parse(localStorage.getItem("AXIOM_VEC")) || null;
const VEC = JSON.parse(localStorage.getItem("ALLXALL_LIGHT")) || null;

/* -----------------------------
   2. STAGE‑Move erzeugen
------------------------------ */
function stageEnter(mode){
    const move = {
        XI: mode,
        IX: mode,
        x4: mode,
        AXIOM,
        VEC
    };

    localStorage.setItem("STAGE_MOVE", JSON.stringify(move));
    localStorage.setItem("STAGE_MODE", mode);

    return move;
}

/* -----------------------------
   3. NC‑Router
------------------------------ */
const NC = {
    S: "./sys/index.html",
    O: "./O/index.html",
    D: "./D/index.html",
    T: "./T/index.html",
    M: "./B/index.html",
    H: "./H/index.html"
};

/* -----------------------------
   4. Startmodus
------------------------------ */
let mode = "S";

/* -----------------------------
   5. Start → Universum
------------------------------ */
function go(){
    const move = stageEnter(mode);
    console.log("STAGE‑MOVE:", move);
    window.location.href = NC[mode];
}

</script>
</head>

<body style="background:#000; color:#0f0; font-family:Consolas;">
