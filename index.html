<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RESPO.ai · Sunnyboy ROOT</title>

<style>
  body {
    background:#000;
    color:#0f0;
    font-family:Consolas;
    margin:0;
    padding:20px;
  }
  h1 {
    color:#0f0;
    font-size:28px;
  }
  .sunny {
    background:#111;
    padding:20px;
    border:1px solid #333;
    margin-top:20px;
  }
  button {
    background:#222;
    color:#0f0;
    border:1px solid #333;
    padding:10px 20px;
    margin-top:20px;
    cursor:pointer;
  }
</style>

<script type="module">

/* -----------------------------------------
   1. VEC + AXIOM empfangen
------------------------------------------ */
const VEC   = JSON.parse(localStorage.getItem("ALLXALL_LIGHT")) || null;
const AXIOM = JSON.parse(localStorage.getItem("AXIOM_VEC")) || null;

/* -----------------------------------------
   2. STAGE laden (Sunnyboy‑Safe‑Load)
------------------------------------------ */
async function loadStage(){
    try {
        const res = await fetch("./stage.html");

        if (!res.ok) {
            const err = await fetch("./404.html");
            const errHtml = await err.text();
            document.getElementById("stagePanel").innerHTML = errHtml;
            return;
        }

        const html = await res.text();
        document.getElementById("stagePanel").innerHTML = html;

    } catch (e) {
        const err = await fetch("./404.html");
        const errHtml = await err.text();
        document.getElementById("stagePanel").innerHTML = errHtml;
    }
}

/* -----------------------------------------
   3. NC‑Router
------------------------------------------ */
const NC = {
    S: "./sys/index.html",
    O: "./O/index.html",
    D: "./D/index.html",
    T: "./T/index.html",
    M: "./B/index.html",
    H: "./H/index.html"
};

/* -----------------------------------------
   4. STAGE‑Move erzeugen
------------------------------------------ */
function stageEnter(mode){
    const move = { XI: mode, IX: mode, x4: mode };
    localStorage.setItem("STAGE_MOVE", JSON.stringify(move));
    localStorage.setItem("STAGE_MODE", mode);
    return move;
}

/* -----------------------------------------
   5. FUSION erzeugen
------------------------------------------ */
function fusion(){
    const STAGE = JSON.parse(localStorage.getItem("STAGE_MOVE")) || null;

    const FUSION = {
        TEAM: "Team² Work³",
        VEC,
        AXIOM,
        STAGE,
        MODE: localStorage.getItem("STAGE_MODE"),
        TIME: Date.now()
    };

    localStorage.setItem("FUSION_UNIVERSUM", JSON.stringify(FUSION));
    return FUSION;
}

/* -----------------------------------------
   6. Sunnyboy‑Start
------------------------------------------ */
window.addEventListener("DOMContentLoaded", loadStage);

</script>
</head>

<body>

<h1>RESPO.ai · Sunnyboy ROOT</h1>

<div class="sunny">
  <p>ROOT geladen.</p>
  <p>STAGE wird automatisch gestartet…</p>
</div>

<div id="stagePanel" class="sunny"></div>

</body>
</html>
