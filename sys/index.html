<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RESPO.ai · NC‑Router</title>

<script type="module">

// 1. STAGE‑Move erzeugen
function stageEnter(mode){
    const move = {
        XI: { in: mode },
        IX: { out: mode },
        x4: { move: mode }
    };

    // Move global speichern
    localStorage.setItem("STAGE_MOVE", JSON.stringify(move));
    localStorage.setItem("STAGE_MODE", mode);

    return move;
}

// 2. NC‑Router
const NC = {
    S: "./sys/index.html",
    H: "./H/index.html",
    B: "./B/index.html",
    T: "./T/index.html",
    t: "./t/index.html"
};

// 3. Startmodus
let mode = "S";

// 4. STAGE‑Move erzeugen
stageEnter(mode);

// 5. Weiterleitung
window.location.href = NC[mode];

</script>

</head>

<body style="background:#000; color:#0f0; font-family:Consolas;">
  <p>NC‑Router aktiv… Weiterleitung zum Orbit‑Zentrum…</p>
</body>
</html>
