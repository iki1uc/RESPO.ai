<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RESPO.ai · NC‑Router</title>

<style>
  body { background:#000; color:#0f0; font-family:Consolas; margin:0; }
  #stagePanel {
    padding:20px;
    background:#111;
    border-bottom:1px solid #333;
  }
  button {
    background:#222; color:#0f0; border:1px solid #333;
    padding:10px 20px; margin-top:10px; cursor:pointer;
  }
</style>

<script type="module">

/* -----------------------------------------
   1. VEC / ALLXALL empfangen
------------------------------------------ */
const VEC = JSON.parse(localStorage.getItem("ALLXALL_LIGHT")) || null;

/* -----------------------------------------
   2. STAGE laden
------------------------------------------ */
async function loadStage(){
    const res = await fetch("./STAGE/index.html");
    const html = await res.text();
    document.getElementById("stagePanel").innerHTML = html;
}

/* -----------------------------------------
   3. NC‑Router
------------------------------------------ */
const NC = {
    S: "./sys/index.html",
    O: "./O/index.html",
    D: "./D/index.html",
    T: "./T/index.html",
    M: "./B/index.html",
    H: "./H/index.html"
};

/* -----------------------------------------
   4. STAGE‑Move erzeugen + VEC fusionieren
------------------------------------------ */
function stageEnter(mode){
    const move = {
        XI: mode,
        IX: mode,
        x4: mode,
        VEC: VEC
    };

    localStorage.setItem("STAGE_MOVE", JSON.stringify(move));
    localStorage.setItem("STAGE_MODE", mode);

    return move;
}

/* -----------------------------------------
   5. Startmodus
------------------------------------------ */
let mode = "S";

/* -----------------------------------------
   6. STAGE laden
------------------------------------------ */
loadStage();

/* -----------------------------------------
   7. Start → Universum
------------------------------------------ */
function go(){
    const move = stageEnter(mode);
    console.log("STAGE‑MOVE:", move);

    window.location.href = NC[mode];
}

</script>

</head>

<body>

<div id="stagePanel">Lade STAGE…</div>

<button onclick="go()">Starten → Universum</button>

</body>
</html>
